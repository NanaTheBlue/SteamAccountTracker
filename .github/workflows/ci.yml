name: CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  dotnet-build-and-test:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore WebApplication1.sln

      - name: Build solution
        run: dotnet build WebApplication1.sln --configuration Release --no-restore

      - name: Security audit dependencies
        run: dotnet list package --vulnerable --include-transitive

      - name: Run unit tests with code coverage
        run: dotnet test WebApplication1.sln --configuration Release --no-build --verbosity normal --logger "trx" --results-directory "TestResults" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

      - name: Validate Docker image build
        run: docker build -t cheaterwatch-api:ci -f WebApplication1/Dockerfile .

  worker-build-and-test:
    name: Typecheck & Test (Cloudflare Worker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: worker
        run: npm install

      - name: Run TypeScript typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Run Worker tests
        working-directory: worker
        run: npm test

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: [dotnet-build-and-test, worker-build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/cheaterwatch
            git pull origin master
            docker compose -f docker-compose.prod.yml up -d --build
            docker system prune -f --volumes=false
            echo "Deploy complete"
