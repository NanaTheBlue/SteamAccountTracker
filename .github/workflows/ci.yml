name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
  dotnet-build-and-test:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore WebApplication1.sln

      - name: Build solution
        run: dotnet build WebApplication1.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test WebApplication1.sln --configuration Release --no-build --verbosity normal --logger "trx" --results-directory "TestResults"
      - name: Security audit dependencies
        run: dotnet list package --vulnerable --include-transitive

      - name: Run unit tests with code coverage
        run: dotnet test WebApplication1.sln --configuration Release --no-build --verbosity normal --logger "trx" --results-directory "TestResults" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          path: TestResults/
          if-no-files-found: ignore

      - name: Validate Docker image build
        run: docker build -t cheaterwatch-api:ci -f WebApplication1/Dockerfile .

  worker-build-and-test:
    name: Typecheck & Test (Cloudflare Worker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Run TypeScript typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Run Worker tests
        working-directory: worker
        run: npm test
