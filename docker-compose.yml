services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cheaterwatch-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_password123' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: WebApplication1/Dockerfile
    container_name: cheaterwatch-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - CONNECTION_STRING=Server=tcp:sqlserver,1433;Initial Catalog=CheaterWatch;User ID=sa;Password=Your_password123;MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;
      - STEAM_API_KEY=${STEAM_API_KEY:-}
      - WORKER_KEY=${WORKER_KEY:-local-worker-secret-key}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver_data:

