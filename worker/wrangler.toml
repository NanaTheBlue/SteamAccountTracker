name = "cheaterwatch-ban-scanner"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/15 * * * *"]

[vars]
FROM_EMAIL = "noreply@alerts.cheaterwatch.com"
API_BASE_URL = "https://api.cheaterwatch.com"

# Use `wrangler secret put` for the following sensitive variables:
# WORKER_KEY
# STEAM_API_KEY
# RESEND_API_KEY

[[queues.producers]]
queue = "steam-scans-queue"
binding = "SCAN_QUEUE"

[[queues.consumers]]
queue = "steam-scans-queue"
max_batch_size = 10    # Up to 10 batches (1000 accounts) processed per worker instance
max_batch_timeout = 5  # Or wait 5 seconds before processing
