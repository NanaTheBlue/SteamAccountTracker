services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cheaterwatch-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${DB_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    image: ${API_IMAGE}
    container_name: cheaterwatch-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - CONNECTION_STRING=Server=tcp:sqlserver,1433;Initial Catalog=CheaterWatch;User ID=sa;Password=${DB_PASSWORD};MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;
      - STEAM_API_KEY=${STEAM_API_KEY}
      - WORKER_KEY=${WORKER_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: cheaterwatch-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - api
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  sqlserver_data:
  caddy_data:
  caddy_config:

